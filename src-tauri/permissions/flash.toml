[[permission]]
identifier = "allow-flash"
description = "Allows locating esptool/toolchain, building sketches, flashing firmware, and reading opened files."
commands.allow = [
  "get_esptool_info",
  "flash_write_firmware",
  "read_open_file",
  "get_firmware_toolchain_info",
  "build_firmware_from_sketch"
]
