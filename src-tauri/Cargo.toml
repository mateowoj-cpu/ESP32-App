[package]
name = "esp32-display-studio"
version = "0.1.0"
description = "ESP32 Display Studio — desktop shell with native serial (COM) support"
authors = ["ESP32 Display Studio"]
license = ""
repository = "https://github.com/mateowoj-cpu/ESP32-App"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serialport = "4.6"
