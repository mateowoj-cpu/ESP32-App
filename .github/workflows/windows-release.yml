name: Windows Release (NSIS / MSI)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Authenticode certificate (optional)
        id: codesign
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          ./scripts/windows/Import-CodeSigningCertificate.ps1 `
            -OutConfigPath "./src-tauri/tauri.windows-signing.local.json"

      - name: Build Tauri Windows bundles
        shell: pwsh
        run: |
          $overlay = "./src-tauri/tauri.windows-signing.local.json"
          if (Test-Path $overlay) {
            Write-Host "Building with Authenticode overlay"
            npm run tauri:build -- --config $overlay
          } else {
            Write-Host "Building unsigned (no certificate secrets)"
            npm run tauri:build
          }

      - name: Upload NSIS / MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
