name: Windows Release (NSIS / MSI / PC Agent / Updater)

# Faza 16 — optional self-hosted runner / EV HSM:
# - workflow_dispatch input `runner` (default windows-latest)
# - or repository variable WINDOWS_RUNNER (e.g. self-hosted label)
# - WINDOWS_CERTIFICATE_THUMBPRINT alone works when the cert is already in the
#   runner store (USB token / cloud HSM). Never invent thumbprints in git.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label — windows-latest (hosted) or self-hosted EV/HSM label"
        required: false
        default: "windows-latest"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installers
    runs-on: ${{ github.event.inputs.runner || vars.WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Assert MSI WiX en-US / ASCII (LGHT0311 guard)
        shell: pwsh
        run: |
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "Ref=$env:GITHUB_REF"
          node ./scripts/windows/assert-msi-ascii-config.mjs

      - name: Build PC agent (.exe)
        shell: pwsh
        run: |
          ./scripts/windows/Build-PcAgent.ps1
          if (-not (Test-Path "./src-tauri/binaries/esp32-pc-agent-x86_64-pc-windows-msvc.exe")) {
            throw "PC agent sidecar missing after build"
          }

      - name: Resolve Authenticode overlay (PFX or EV thumbprint)
        id: codesign
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          ./scripts/windows/Resolve-CodeSigningOverlay.ps1 `
            -OutConfigPath "./src-tauri/tauri.windows-signing.local.json"

      # Mirror desktop-unix-release: without TAURI_SIGNING_PRIVATE_KEY, disable
      # createUpdaterArtifacts so NSIS/MSI still succeed (empty/malformed env used
      # to fail after bundles with "Missing comment in secret key").
      - name: Select updater signing config
        id: updater
        env:
          HAS_TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          if ($env:HAS_TAURI_KEY -eq 'true') {
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "TAURI_SIGNING_PRIVATE_KEY present — updater artifacts enabled (base conf)."
          } else {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "TAURI_SIGNING_PRIVATE_KEY unset — will merge tauri.windows.updater-unsigned.json."
          }

      - name: Build Tauri Windows bundles
        shell: pwsh
        env:
          HAS_TAURI_KEY: ${{ steps.updater.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Never leave empty signing env vars — Tauri treats them as a key and fails decode.
          if ($env:HAS_TAURI_KEY -ne 'true') {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

          $cmd = "npm run tauri:build --"
          if (Test-Path "./src-tauri/tauri.windows-signing.local.json") {
            $cmd += " --config ./src-tauri/tauri.windows-signing.local.json"
          }
          if (Test-Path "./src-tauri/resources/windows/esp32-pc-agent.exe") {
            $cmd += " --config ./src-tauri/tauri.windows-agent.example.json"
          }
          if ($env:HAS_TAURI_KEY -ne 'true') {
            $cmd += " --config ./src-tauri/tauri.windows.updater-unsigned.json"
          }
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit $LASTEXITCODE" }

      - name: Stage beta updater manifest (beta tags)
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'beta')
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.json" -ErrorAction SilentlyContinue
          $root = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "latest.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          $src = if ($root) { $root.FullName } elseif ($nsis) { $nsis[0].FullName } else { $null }
          if ($src) {
            Copy-Item -Force $src "latest-beta.json"
            Write-Host "Staged latest-beta.json from $src"
          } else {
            Write-Host "No latest.json found to clone as latest-beta.json"
          }

      - name: Upload NSIS / MSI / PC Agent / updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
            latest-beta.json
          if-no-files-found: warn

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
            latest-beta.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
