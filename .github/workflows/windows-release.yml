name: Windows Release (NSIS / MSI / PC Agent / Updater)

# Faza 16 — optional self-hosted runner / EV HSM:
# - workflow_dispatch input `runner` (default windows-latest)
# - or repository variable WINDOWS_RUNNER (e.g. self-hosted label)
# - WINDOWS_CERTIFICATE_THUMBPRINT alone works when the cert is already in the
#   runner store (USB token / cloud HSM). Never invent thumbprints in git.
#
# Updater signing: base tauri.conf.json has createUpdaterArtifacts:false.
# Signed overlay is used ONLY when TAURI_SIGNING_PRIVATE_KEY looks like minisign.
# Unsigned build step does NOT inject TAURI_SIGNING_* into the process env at all.
#
# NEVER click "Re-run" on an old workflow_dispatch — GitHub keeps the original
# head_sha. After merging workflow fixes, start a NEW "Run workflow" on tip main.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label — windows-latest (hosted) or self-hosted EV/HSM label"
        required: false
        default: "windows-latest"
      confirm_fresh_dispatch:
        description: "Type NEW (not Re-run). Re-run keeps a stale commit and will fail this guard."
        required: true
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installers
    runs-on: ${{ github.event.inputs.runner || vars.WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse Re-run / stale SHA (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          CONFIRM: ${{ github.event.inputs.confirm_fresh_dispatch }}
        run: |
          $confirm = ($env:CONFIRM ?? "").Trim().ToUpperInvariant()
          if ($confirm -ne "NEW") {
            throw "Set confirm_fresh_dispatch=NEW and start a NEW Run workflow (not Re-run). Got: '$($env:CONFIRM)'"
          }

          git fetch origin main --prune
          $head = (git rev-parse HEAD).Trim()
          $tip = (git rev-parse origin/main).Trim()
          Write-Host "HEAD=$head"
          Write-Host "origin/main tip=$tip"
          Write-Host "run_attempt=$env:GITHUB_RUN_ATTEMPT"
          Write-Host "run_id=$env:GITHUB_RUN_ID"

          if ($env:GITHUB_RUN_ATTEMPT -ne "1") {
            throw "Refusing Re-run (attempt $($env:GITHUB_RUN_ATTEMPT)). GitHub Re-run keeps the ORIGINAL head_sha and will never pick up workflow fixes. Actions → Windows Release → Run workflow (fresh) on tip of main."
          }

          if ($head -ne $tip) {
            throw "Refusing stale SHA $head (origin/main tip is $tip). This usually means a Re-run of an old dispatch. Start a NEW workflow_dispatch."
          }

          Write-Host "OK: fresh dispatch on tip of main."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Assert MSI WiX en-US / ASCII (LGHT0311 guard)
        shell: pwsh
        run: |
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "Ref=$env:GITHUB_REF"
          node ./scripts/windows/assert-msi-ascii-config.mjs

      - name: Build PC agent (.exe)
        shell: pwsh
        run: |
          ./scripts/windows/Build-PcAgent.ps1
          if (-not (Test-Path "./src-tauri/binaries/esp32-pc-agent-x86_64-pc-windows-msvc.exe")) {
            throw "PC agent sidecar missing after build"
          }

      - name: Resolve Authenticode overlay (PFX or EV thumbprint)
        id: codesign
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          ./scripts/windows/Resolve-CodeSigningOverlay.ps1 `
            -OutConfigPath "./src-tauri/tauri.windows-signing.local.json"

      - name: Select updater signing config
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          . ./scripts/windows/Test-TauriUpdaterKey.ps1
          $valid = Test-TauriUpdaterKeyFormat -Key $env:TAURI_SIGNING_PRIVATE_KEY
          # Drop key from this step's env before finishing (defense in depth).
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
          if ($valid) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=true"
            Write-Host "Updater key format OK — signed build step will run."
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=false"
            Write-Host "Updater key missing/invalid — UNSIGNED build (no TAURI_SIGNING_* in env)."
          }

      # UNSIGNED: secrets must NOT appear in the step `env:` map at all.
      # createUpdaterArtifacts stays false via base conf + unsigned overlay.
      - name: Build Tauri Windows bundles (unsigned updater)
        if: steps.updater.outputs.signed != 'true'
        shell: pwsh
        run: |
          # Assert signing env is absent — Tauri must never see an empty/placeholder key.
          if (Test-Path Env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY unexpectedly set in unsigned build step"
          }
          if (Test-Path Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD unexpectedly set in unsigned build step"
          }

          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "updater.signed=false (unsigned path)"

          $cmd = "npm run tauri:build --"
          if (Test-Path "./src-tauri/tauri.windows-signing.local.json") {
            $cmd += " --config ./src-tauri/tauri.windows-signing.local.json"
          }
          if (Test-Path "./src-tauri/resources/windows/esp32-pc-agent.exe") {
            $cmd += " --config ./src-tauri/tauri.windows-agent.example.json"
          }
          $cmd += " --config ./src-tauri/tauri.windows.updater-unsigned.json"
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit $LASTEXITCODE" }

      - name: Build Tauri Windows bundles (signed updater)
        if: steps.updater.outputs.signed == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "updater.signed=true (signed path)"

          $cmd = "npm run tauri:build --"
          if (Test-Path "./src-tauri/tauri.windows-signing.local.json") {
            $cmd += " --config ./src-tauri/tauri.windows-signing.local.json"
          }
          if (Test-Path "./src-tauri/resources/windows/esp32-pc-agent.exe") {
            $cmd += " --config ./src-tauri/tauri.windows-agent.example.json"
          }
          $cmd += " --config ./src-tauri/tauri.windows.updater-signed.json"
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit $LASTEXITCODE" }

      - name: Stage beta updater manifest (beta tags)
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'beta')
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.json" -ErrorAction SilentlyContinue
          $root = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "latest.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          $src = if ($root) { $root.FullName } elseif ($nsis) { $nsis[0].FullName } else { $null }
          if ($src) {
            Copy-Item -Force $src "latest-beta.json"
            Write-Host "Staged latest-beta.json from $src"
          } else {
            Write-Host "No latest.json found to clone as latest-beta.json"
          }

      - name: Upload NSIS / MSI / PC Agent / updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
            latest-beta.json
          if-no-files-found: warn

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
            latest-beta.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
