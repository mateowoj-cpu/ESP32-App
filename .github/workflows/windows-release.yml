name: Windows Release (NSIS / MSI / PC Agent / Updater)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build PC agent (.exe)
        shell: pwsh
        run: |
          ./scripts/windows/Build-PcAgent.ps1
          if (-not (Test-Path "./src-tauri/binaries/esp32-pc-agent-x86_64-pc-windows-msvc.exe")) {
            throw "PC agent sidecar missing after build"
          }

      - name: Import Authenticode certificate (optional)
        id: codesign
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          ./scripts/windows/Import-CodeSigningCertificate.ps1 `
            -OutConfigPath "./src-tauri/tauri.windows-signing.local.json"

      - name: Build Tauri Windows bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $cmd = "npm run tauri:build --"
          if (Test-Path "./src-tauri/tauri.windows-signing.local.json") {
            $cmd += " --config ./src-tauri/tauri.windows-signing.local.json"
          }
          if (Test-Path "./src-tauri/resources/windows/esp32-pc-agent.exe") {
            $cmd += " --config ./src-tauri/tauri.windows-agent.example.json"
          }
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit $LASTEXITCODE" }

      - name: Upload NSIS / MSI / PC Agent / updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            tools/pc-agent/dist/esp32-pc-agent.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
