name: macOS Release (dmg)

# Separate macOS-only installer build (dmg).
# Updater signing: createUpdaterArtifacts stays false unless TAURI_SIGNING_PRIVATE_KEY
# looks like a real minisign key. Unsigned build steps do NOT inject TAURI_SIGNING_*.
# Optional Apple codesign / notarize when APPLE_* secrets are present.
#
# NEVER click "Re-run" on an old workflow_dispatch — start a NEW "Run workflow".

on:
  workflow_dispatch:
    inputs:
      confirm_fresh_dispatch:
        description: "Type NEW (not Re-run). Re-run keeps a stale commit and will fail this guard."
        required: true
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    name: Build macOS dmg
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse Re-run / stale SHA (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm_fresh_dispatch }}
        run: |
          set -euo pipefail
          confirm="$(echo "${CONFIRM:-}" | tr '[:lower:]' '[:upper:]' | xargs)"
          if [ "$confirm" != "NEW" ]; then
            echo "Set confirm_fresh_dispatch=NEW and start a NEW Run workflow (not Re-run). Got: '${CONFIRM}'" >&2
            exit 1
          fi
          git fetch origin main --prune
          head="$(git rev-parse HEAD)"
          tip="$(git rev-parse origin/main)"
          echo "HEAD=$head"
          echo "origin/main tip=$tip"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Refusing Re-run (attempt ${GITHUB_RUN_ATTEMPT}). Start a NEW workflow_dispatch on tip of main." >&2
            exit 1
          fi
          if [ "$head" != "$tip" ]; then
            echo "Refusing stale SHA $head (origin/main tip is $tip)." >&2
            exit 1
          fi
          echo "OK: fresh dispatch on tip of main."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve / assert app version
        id: version
        env:
          APP_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node ./scripts/ci/assert-app-version.mjs --github-output

      - name: Select updater signing + Apple options
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          node ./scripts/ci/looks-like-tauri-updater-key.mjs --github-output
          unset TAURI_SIGNING_PRIVATE_KEY || true
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            echo "apple_codesign=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple_codesign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_NOTARY" = "true" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer ID certificate (optional)
        if: steps.updater.outputs.apple_codesign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/apple-dev-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/esp32-apple-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KC_PASS="${KEYCHAIN_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "Imported Apple Developer ID certificate into temporary keychain."

      # UNSIGNED: secrets must NOT appear in the step `env:` map at all.
      - name: Build Tauri macOS dmg (unsigned updater)
        if: steps.updater.outputs.signed != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "TAURI_SIGNING_* unexpectedly set in unsigned build step" >&2
            exit 1
          fi
          echo "version=${{ steps.version.outputs.version }} updater.signed=false"
          npm run tauri:build -- --config src-tauri/tauri.macos.json

      - name: Build Tauri macOS dmg (signed updater)
        if: steps.updater.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          echo "version=${{ steps.version.outputs.version }} updater.signed=true"
          npm run tauri:build -- --config src-tauri/tauri.macos.signed.json

      - name: Notarize and staple dmg (optional)
        if: steps.updater.outputs.notarize == 'true' && steps.updater.outputs.apple_codesign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/unix/macos-notarize-dmg.sh
          ./scripts/unix/macos-notarize-dmg.sh

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-macos-${{ steps.version.outputs.artifact_suffix }}
          path: |
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
          if-no-files-found: warn

      - name: Upload macOS updater signature fragments (signed builds only)
        if: steps.updater.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-macos-updater-${{ steps.version.outputs.artifact_suffix }}
          path: |
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.json
          if-no-files-found: warn

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
