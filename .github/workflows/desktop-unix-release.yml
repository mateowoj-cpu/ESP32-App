name: Desktop Unix Release (AppImage / deb / dmg)

# Faza 13–14 — packaging for Linux and macOS (no store submit by default).
# Windows remains the primary signed release path (windows-release.yml).
# Optional AppImage-only smoke: desktop-unix-appimage-smoke.yml (workflow_dispatch).
# Optional macOS notarize checklist: docs/macos-notarize.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-packages:
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libssl-dev \
            pkg-config \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Linux bundles
        run: npm run tauri:build -- --config src-tauri/tauri.linux.json

      - name: Upload AppImage / deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-linux
          path: |
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
          if-no-files-found: warn

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-dmg:
    name: macOS dmg
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri macOS dmg
        run: npm run tauri:build -- --config src-tauri/tauri.macos.json

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-display-studio-macos
          path: |
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
          if-no-files-found: warn

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
