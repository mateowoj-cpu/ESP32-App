name: Desktop Unix — multiplatform latest.json (optional)

# Linux and macOS installer builds moved to separate workflows (run each OS personally):
#   - .github/workflows/linux-release.yml
#   - .github/workflows/macos-release.yml
# Windows remains: .github/workflows/windows-release.yml
#
# This workflow only assembles a multi-platform latest.json when signed platform
# JSON fragments are available (see docs/desktop-unix.md). It does not build installers.
#
# Updater signing: never invents signatures; skips when TAURI_SIGNING_PRIVATE_KEY
# is missing/invalid (minisign format gate).

on:
  workflow_dispatch:
    inputs:
      confirm_fresh_dispatch:
        description: "Type NEW (not Re-run). Re-run keeps a stale commit and will fail this guard."
        required: true
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-unix-latest-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplatform-latest-json:
    name: Assemble multi-platform latest.json (optional)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse Re-run / stale SHA (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm_fresh_dispatch }}
        run: |
          set -euo pipefail
          confirm="$(echo "${CONFIRM:-}" | tr '[:lower:]' '[:upper:]' | xargs)"
          if [ "$confirm" != "NEW" ]; then
            echo "Set confirm_fresh_dispatch=NEW and start a NEW Run workflow (not Re-run). Got: '${CONFIRM}'" >&2
            exit 1
          fi
          git fetch origin main --prune
          head="$(git rev-parse HEAD)"
          tip="$(git rev-parse origin/main)"
          echo "HEAD=$head"
          echo "origin/main tip=$tip"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Refusing Re-run (attempt ${GITHUB_RUN_ATTEMPT}). Start a NEW workflow_dispatch on tip of main." >&2
            exit 1
          fi
          if [ "$head" != "$tip" ]; then
            echo "Refusing stale SHA $head (origin/main tip is $tip)." >&2
            exit 1
          fi
          echo "OK: fresh dispatch on tip of main."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve / assert app version
        id: version
        env:
          APP_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node ./scripts/ci/assert-app-version.mjs --github-output

      - name: Gate updater key format
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node ./scripts/ci/looks-like-tauri-updater-key.mjs --github-output
          unset TAURI_SIGNING_PRIVATE_KEY || true

      - name: Download platform updater fragments (if any)
        uses: actions/download-artifact@v4
        with:
          path: updater-frags
        continue-on-error: true

      - name: Build multi-platform latest.json when fragments exist
        id: assemble
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.updater.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ]; then
            echo "Updater key missing/invalid — skip multi-platform latest.json."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/unix/build-multiplatform-latest-json.sh
          WIN=""
          LIN=""
          DAR=""
          # Humans may upload artifacts named windows-platform.json /
          # linux-platform.json / darwin-platform.json (real signatures only).
          if [ -d updater-frags ]; then
            for name in windows-platform.json linux-platform.json darwin-platform.json; do
              f=$(find updater-frags -type f -name "$name" 2>/dev/null | head -n1 || true)
              case "$name" in
                windows-platform.json) [ -n "$f" ] && WIN="$f" ;;
                linux-platform.json) [ -n "$f" ] && LIN="$f" ;;
                darwin-platform.json) [ -n "$f" ] && DAR="$f" ;;
              esac
            done
          fi
          if [ -z "${WIN}${LIN}${DAR}" ]; then
            echo "No signed platform JSON fragments found — skip attach (see docs/desktop-unix.md)."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=(--version "$VERSION" --notes "ESP32 Display Studio $VERSION" --out latest.multiplatform.json)
          [ -n "$WIN" ] && ARGS+=(--windows "$WIN")
          [ -n "$LIN" ] && ARGS+=(--linux "$LIN")
          [ -n "$DAR" ] && ARGS+=(--darwin "$DAR")
          ./scripts/unix/build-multiplatform-latest-json.sh "${ARGS[@]}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Attach latest.json to release
        if: steps.assemble.outputs.built == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: latest.multiplatform.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
