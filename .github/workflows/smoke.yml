name: Smoke (PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-smoke:
    name: Lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Serial mock tests
        run: npm run test:serial

      - name: Deep link unit tests
        run: npm run test:deeplink

      - name: i18n unit tests
        run: npm run test:i18n

      - name: Production build
        run: npm run build

      - name: PC agent smoke (--once)
        run: |
          pip install -r tools/pc-agent/requirements.txt
          python tools/pc-agent/esp32_pc_agent.py --once --host 127.0.0.1 --port 9 --no-gpu

  rust-smoke:
    name: Cargo check (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies (schema / conf)
        run: npm ci

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
